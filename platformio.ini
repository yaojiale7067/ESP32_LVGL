; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 模块：Flash 用 QIO，PSRAM 是 Octal(OPI)。
; memory_type 会一次性决定 SDK 目录(tools/sdk/esp32s3/<memory_type>)、
; -DBOARD_HAS_PSRAM 以及 boot mode(opi)，所以下面这两行是多余的、删掉避免误解：
;   board_build.psram_mode = opi      -> 由 memory_type 的 "opi" 后缀覆盖
;   board_build.flash_mode = qio      -> memory_type 含 opi 时会被 builder 强制成 "dout"
board_build.arduino.memory_type = qio_opi
board_build.psram = enable
board_build.partitions = huge_app.csv

; f_cpu / CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ 与 board JSON 的 240MHz 重复，删掉
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE=1
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	; 蓝牙(BLE)串口功能开关。ESP32-S3 只有 BLE，没有经典蓝牙 SPP。
	; 若 WiFi + BLE 同时用导致内存不足/初始化失败，改成 0 再编译即可，
	; 源码里的 #if ENABLE_BLE 会把 BLE 屏幕、任务、按钮全部裁掉。
	-DENABLE_BLE=1
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
