; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino


board_build.arduino.memory_type = qio_opi
board_build.psram = enable
board_build.partitions = huge_app.csv

; f_cpu / CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ 与 board JSON 的 240MHz 重复，删掉
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE=1
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	; ── 功能开关 ──────────────────────────────────────────────
	; ENABLE_BLE：蓝牙(BLE)串口。ESP32-S3 只有 BLE，没有经典蓝牙 SPP。
	;   现在关闭。改成 1 可恢复：BLE 屏、BLE 任务、主菜单的 Bluetooth 行
	;   会一起回来（源码里的 #if ENABLE_BLE 负责裁剪）。
	-DENABLE_BLE=1
	; ENABLE_CLOCK：温湿度屏的东八区时间显示。
	;   现在关闭。改成 1 可恢复（时间标签会重新出现在卡片和状态条之间）。
	-DENABLE_CLOCK=0
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	adafruit/DHT sensor library@^1.4.6
