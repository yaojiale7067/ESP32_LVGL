; PlatformIO Project Configuration File
; 配置针对 ESP32-S3 N16R8（16MB Flash，不使用 PSRAM）

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 基础编译标志（移除 PSRAM 相关）
build_flags = 
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DCORE_DEBUG_LEVEL=0
    -Os                           ; 优化体积，提高稳定性

; 板级配置（不使用 PSRAM，Flash 16MB）
board_build.partitions = huge_app.csv   ; 16MB 分区表
board_build.flash_mode = dio                ; Flash 模式（根据模块选择 qio/dio）
board_build.f_cpu = 240000000L

; 明确禁用 PSRAM（不配置 board_build.psram 即可）
; 如果之前有启用，现在默认关闭

; 上传和监视器设置
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 库依赖（仅保留 DHT sensor library）
lib_deps = 
    adafruit/DHT sensor library@^1.4.6