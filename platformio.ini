; PlatformIO Project Configuration File
; 针对 ESP32-S3 N16R8 (16MB Flash + 8MB PSRAM) 优化配置
; 保留用户自定义分区表 huge_app.csv

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ===== 板级核心配置（正确启用 PSRAM）=====
board_build.arduino.memory_type = qio_opi   ; 必须！启用 OPI PSRAM
board_build.flash_mode = qio                ; Flash 四线模式
board_build.f_cpu = 240000000L
board_build.psram = enable
board_build.psram_mode = opi                ; ESP32-S3 N16R8 使用 OPI PSRAM

; ===== 分区表：保留用户自定义的 huge_app.csv =====
board_build.partitions = huge_app.csv       ; 您自己的分区表，不做修改

; ===== 编译标志 =====
build_flags = 
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM               ; 强制启用 PSRAM 宏
    -mfix-esp32-psram-cache-issue   ; 修复 PSRAM 缓存问题
    -Os

; ===== 上传和监视器 =====
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ===== 库依赖 =====
lib_deps = 
    adafruit/DHT sensor library@^1.4.6